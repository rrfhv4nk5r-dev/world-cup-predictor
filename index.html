<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
      <script data-goatcounter="https://sinou.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

    <title>Road to the Trophy – World Cup 2026</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/XxzmxSk0/trophy-1.png">
    <style>
        /* ───────────── RESET & BASE ───────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e14;
            color: #e8edf2;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 860px;
            width: 100%;
        }

        /* ───────────── HEADER ───────────── */
        .header {
            text-align: center;
            padding: 24px 0 32px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 32px;
        }

        .header .trophy {
            font-size: 3rem;
            display: block;
            margin-bottom: 4px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f5e6a3, #d4af37);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header p {
            color: #8896a6;
            font-size: 0.95rem;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .header .round-badge {
            display: inline-block;
            margin-top: 10px;
            background: rgba(212, 175, 55, 0.15);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #d4af37;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ───────────── MATCH CARDS ───────────── */
        .match-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 18px 20px;
            margin-bottom: 14px;
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .match-card:hover {
            border-color: rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .match-card .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #6a7a8a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 6px;
        }

        .match-card .match-teams {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .match-card .team-btn {
            flex: 1 0 auto;
            min-width: 80px;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #c8d0d8;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: inherit;
        }

        .match-card .team-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .match-card .team-btn.selected {
            background: linear-gradient(135deg, #d4af37, #b8942a);
            border-color: #d4af37;
            color: #0a0e14;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        }

        .match-card .vs {
            font-size: 0.7rem;
            font-weight: 700;
            color: #4a5a6a;
            padding: 0 4px;
            letter-spacing: 1px;
            flex: 0 0 auto;
        }

        .match-card .match-status {
            font-size: 0.7rem;
            color: #4a5a6a;
            margin-top: 8px;
            text-align: right;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 6px;
        }

        .match-card .match-status .picked {
            color: #d4af37;
            font-weight: 600;
        }

        /* ───────────── ACTION BUTTONS ───────────── */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 28px 0 20px;
        }

        .actions button {
            flex: 1 0 auto;
            padding: 14px 28px;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #b8942a);
            color: #0a0e14;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #a0b0c0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e8edf2;
        }

        .btn-share {
            background: linear-gradient(135deg, #2a7a4a, #1a5a3a);
            color: #e8edf2;
            box-shadow: 0 4px 16px rgba(42, 122, 74, 0.2);
        }

        .btn-share:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(42, 122, 74, 0.35);
        }

        /* ───────────── RESULTS / BRACKET ───────────── */
        .result-area {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 24px;
            margin-top: 24px;
            transition: all 0.3s;
        }

        .result-area h3 {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .result-area .bracket-path {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
        }

        .result-area .bracket-path .step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #b0c0d0;
        }

        .result-area .bracket-path .step .arrow {
            color: #4a5a6a;
            font-size: 1.2rem;
        }

        .result-area .bracket-path .step .winner {
            color: #d4af37;
            font-weight: 700;
        }

        .result-area .empty-state {
            color: #6a7a8a;
            font-size: 0.95rem;
            text-align: center;
            padding: 16px 0;
        }

        /* ───────────── FOOTER ───────────── */
        .footer {
            text-align: center;
            padding: 32px 0 12px;
            font-size: 0.7rem;
            color: #3a4a5a;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 32px;
            letter-spacing: 0.3px;
        }

        .footer a {
            color: #6a7a8a;
            text-decoration: none;
        }

        .footer a:hover {
            color: #d4af37;
        }

        /* ───────────── RESPONSIVE ───────────── */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.6rem; }
            .match-card { padding: 14px 16px; }
            .match-card .team-btn {
                min-width: 60px;
                font-size: 0.8rem;
                padding: 8px 10px;
            }
            .actions button {
                font-size: 0.85rem;
                padding: 12px 18px;
            }
            .result-area { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="app">

    <!-- ═══ HEADER ═══ -->
    <header class="header">
        <span class="trophy">🏆</span>
        <h1>Road to the Trophy</h1>
        <p>Pick the winners. Follow the path.</p>
        <span class="round-badge">⚡ Round of 32</span>
    </header>

    <!-- ═══ MATCHES ═══ -->
    <div id="matchesContainer"></div>

    <!-- ═══ ACTIONS ═══ -->
    <div class="actions">
        <button class="btn-primary" id="generateBtn">🔮 Show My Road</button>
        <button class="btn-secondary" id="resetBtn">⟳ Reset All</button>
        <button class="btn-share" id="shareBtn">📋 Copy My Bracket</button>
    </div>

    <!-- ═══ RESULTS ═══ -->
    <div class="result-area" id="resultArea">
        <div class="empty-state">✨ Pick a winner for each match to start your road.</div>
    </div>

    <!-- ═══ FOOTER ═══ -->
    <footer class="footer">
        Built by a young fan · World Cup 2026 · <a href="#" onclick="window.location.reload();">↻ Refresh</a>
    </footer>

</div>

<script>
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // ROUND OF 32 MATCH DATA
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const matchesData = [
        { id: 0, teamA: "South Africa", teamB: "Canada" },
        { id: 1, teamA: "Brazil", teamB: "Japan" },
        { id: 2, teamA: "Germany", teamB: "Paraguay" },
        { id: 3, teamA: "Netherlands", teamB: "Morocco" },
        { id: 4, teamA: "Ivory Coast", teamB: "Norway" },
        { id: 5, teamA: "France", teamB: "Sweden" },
        { id: 6, teamA: "Mexico", teamB: "Ecuador" },
        { id: 7, teamA: "England", teamB: "DR Congo" },
        { id: 8, teamA: "Belgium", teamB: "Senegal" },
        { id: 9, teamA: "United States", teamB: "Bosnia-Herzegovina" },
        { id: 10, teamA: "Spain", teamB: "Austria" },
        { id: 11, teamA: "Portugal", teamB: "Croatia" },
        { id: 12, teamA: "Switzerland", teamB: "Algeria" },
        { id: 13, teamA: "Australia", teamB: "Egypt" },
        { id: 14, teamA: "Argentina", teamB: "Cape Verde" },
        { id: 15, teamA: "Colombia", teamB: "Ghana" }
    ];

    let picks = {}; // { matchId: "teamName" }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // STORAGE
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function loadPicks() {
        const saved = localStorage.getItem("ro32_picks");
        if (saved) {
            try { picks = JSON.parse(saved); } catch (e) {}
        }
        if (!picks) picks = {};
    }

    function savePicks() {
        localStorage.setItem("ro32_picks", JSON.stringify(picks));
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RENDER MATCHES
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderMatches() {
        const container = document.getElementById("matchesContainer");
        if (!container) return;
        container.innerHTML = "";

        matchesData.forEach((match, index) => {
            const selected = picks[index] || null;

            const card = document.createElement("div");
            card.className = "match-card";

            const header = document.createElement("div");
            header.className = "match-header";
            header.innerHTML = `<span>Match ${index + 1} of 16</span><span>🏆 Round of 32</span>`;
            card.appendChild(header);

            const teamsDiv = document.createElement("div");
            teamsDiv.className = "match-teams";

            const btnA = document.createElement("button");
            btnA.className = `team-btn ${selected === match.teamA ? 'selected' : ''}`;
            btnA.textContent = match.teamA;
            btnA.onclick = (function(idx, team) {
                return function() { selectWinner(idx, team); };
            })(index, match.teamA);

            const vsSpan = document.createElement("span");
            vsSpan.className = "vs";
            vsSpan.textContent = "VS";

            const btnB = document.createElement("button");
            btnB.className = `team-btn ${selected === match.teamB ? 'selected' : ''}`;
            btnB.textContent = match.teamB;
            btnB.onclick = (function(idx, team) {
                return function() { selectWinner(idx, team); };
            })(index, match.teamB);

            teamsDiv.appendChild(btnA);
            teamsDiv.appendChild(vsSpan);
            teamsDiv.appendChild(btnB);
            card.appendChild(teamsDiv);

            const status = document.createElement("div");
            status.className = "match-status";
            if (selected) {
                status.innerHTML = `✓ <span class="picked">${selected}</span> advances`;
            } else {
                status.textContent = "— pick a winner";
            }
            card.appendChild(status);

            container.appendChild(card);
        });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SELECT WINNER
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function selectWinner(matchId, team) {
        if (picks[matchId] === team) {
            delete picks[matchId];
        } else {
            picks[matchId] = team;
        }
        savePicks();
        renderMatches();
        // Clear results so user sees fresh state
        const resultArea = document.getElementById("resultArea");
        if (resultArea) {
            resultArea.innerHTML = `<div class="empty-state">✨ Tap "Show My Road" to see your path.</div>`;
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // GENERATE ROAD
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function generateRoad() {
        const resultArea = document.getElementById("resultArea");
        const allPicked = matchesData.every((_, idx) => picks[idx] !== undefined);

        if (!allPicked) {
            const missing = matchesData.filter((_, idx) => picks[idx] === undefined);
            resultArea.innerHTML = `<div style="color: #c0392b; font-weight: 600; padding: 12px 0;">⚠️ You haven't picked a winner for ${missing.length} match${missing.length > 1 ? 'es' : ''}.</div>`;
            return;
        }

        // Build the road: Round of 32 winners → Round of 16 matchups
        const winners = matchesData.map((match, idx) => picks[idx]);

        // Round of 16 pairings (based on bracket order)
        const ro16Pairs = [];
        for (let i = 0; i < winners.length; i += 2) {
            if (i + 1 < winners.length) {
                ro16Pairs.push([winners[i], winners[i + 1]]);
            }
        }

        // Quarterfinal pairings (simplified)
        const qfPairs = [];
        for (let i = 0; i < ro16Pairs.length; i += 2) {
            if (i + 1 < ro16Pairs.length) {
                qfPairs.push([ro16Pairs[i], ro16Pairs[i + 1]]);
            }
        }

        // Semifinal pairings
        const sfPairs = [];
        for (let i = 0; i < qfPairs.length; i += 2) {
            if (i + 1 < qfPairs.length) {
                sfPairs.push([qfPairs[i], qfPairs[i + 1]]);
            }
        }

        // Final
        const finalPair = sfPairs.length === 2 ? [sfPairs[0], sfPairs[1]] : null;

        // ─── Build the HTML ───
        let html = `<h3>🏆 Your Road to the Trophy</h3>`;

        html += `<div style="margin: 12px 0 18px; padding: 12px 16px; background: rgba(212,175,55,0.06); border-radius: 16px; border-left: 3px solid #d4af37;">`;
        html += `<div style="font-size:0.7rem; color:#6a7a8a; text-transform:uppercase; letter-spacing:0.5px;">Round of 32 Winners</div>`;
        html += `<div style="display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:4px;">`;
        winners.forEach((w, i) => {
            html += `<span style="font-size:0.85rem; font-weight:600; color:#e8edf2;">${i+1}. ${w}</span>`;
        });
        html += `</div></div>`;

        // Round of 16
        html += `<div style="margin: 12px 0;"><div style="font-size:0.7rem; color:#6a7a8a; text-transform:uppercase; letter-spacing:0.5px;">Round of 16 Matchups</div>`;
        ro16Pairs.forEach((pair, i) => {
            html += `<div style="display:flex; align-items:center; gap:8px; font-size:0.9rem; color:#b0c0d0; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.04);">
                        <span style="font-weight:600; color:#d4af37;">Match ${i+1}:</span>
                        <span>${pair[0]}</span>
                        <span style="color:#4a5a6a;">vs</span>
                        <span>${pair[1]}</span>
                     </div>`;
        });
        html += `</div>`;

        // Quarterfinals
        html += `<div style="margin: 12px 0;"><div style="font-size:0.7rem; color:#6a7a8a; text-transform:uppercase; letter-spacing:0.5px;">Quarterfinals</div>`;
        qfPairs.forEach((pair, i) => {
            html += `<div style="display:flex; align-items:center; gap:8px; font-size:0.9rem; color:#b0c0d0; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.04);">
                        <span style="font-weight:600; color:#d4af37;">QF ${i+1}:</span>
                        <span>Winner of Match ${i*2+1}</span>
                        <span style="color:#4a5a6a;">vs</span>
                        <span>Winner of Match ${i*2+2}</span>
                     </div>`;
        });
        html += `</div>`;

        // Semifinals
        html += `<div style="margin: 12px 0;"><div style="font-size:0.7rem; color:#6a7a8a; text-transform:uppercase; letter-spacing:0.5px;">Semifinals</div>`;
        sfPairs.forEach((pair, i) => {
            html += `<div style="display:flex; align-items:center; gap:8px; font-size:0.9rem; color:#b0c0d0; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.04);">
                        <span style="font-weight:600; color:#d4af37;">SF ${i+1}:</span>
                        <span>Winner of QF ${i*2+1}</span>
                        <span style="color:#4a5a6a;">vs</span>
                        <span>Winner of QF ${i*2+2}</span>
                     </div>`;
        });
        html += `</div>`;

        // Final
        if (finalPair) {
            html += `<div style="margin: 16px 0 8px; padding: 14px 16px; background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02)); border-radius: 16px; border: 1px solid rgba(212,175,55,0.2); text-align:center;">`;
            html += `<div style="font-size:0.7rem; color:#6a7a8a; text-transform:uppercase; letter-spacing:0.5px;">🏆 The Final</div>`;
            html += `<div style="font-size:1.2rem; font-weight:800; color:#d4af37; margin:4px 0;">${finalPair[0][0]} vs ${finalPair[0][1]}</div>`;
            html += `<div style="font-size:0.7rem; color:#6a7a8a; margin-top:4px;">Your champion will be crowned from this match</div>`;
            html += `</div>`;
        }

        html += `<div style="margin-top:16px; font-size:0.75rem; color:#4a5a6a; text-align:center; border-top:1px solid rgba(255,255,255,0.04); padding-top:12px;">📋 Share this road with friends — tap "Copy My Bracket"</div>`;

        resultArea.innerHTML = html;
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // SHARE BRACKET
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function shareBracket() {
        const allPicked = matchesData.every((_, idx) => picks[idx] !== undefined);
        if (!allPicked) {
            alert("⚠️ Complete all your picks first!");
            return;
        }

        const winners = matchesData.map((_, idx) => picks[idx]);
        let text = "🏆 MY ROAD TO THE TROPHY 🏆\n\n";
        text += "⚡ Round of 32 Winners:\n";
        winners.forEach((w, i) => { text += `${i+1}. ${w}\n`; });

        text += "\n🔮 Round of 16 Matchups:\n";
        for (let i = 0; i < winners.length; i += 2) {
            if (i + 1 < winners.length) {
                text += `Match ${i/2+1}: ${winners[i]} vs ${winners[i+1]}\n`;
            }
        }

        text += "\n🏆 Build your own road: https://rrfhv4nk5r-dev.github.io/world-cup-predictor/";

        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById("shareBtn");
            const original = btn.textContent;
            btn.textContent = "✅ Copied!";
            setTimeout(() => { btn.textContent = original; }, 2000);
        }).catch(() => {
            alert("Could not copy. Please copy manually.");
        });
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // RESET
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function resetAll() {
        picks = {};
        savePicks();
        renderMatches();
        const resultArea = document.getElementById("resultArea");
        if (resultArea) {
            resultArea.innerHTML = `<div class="empty-state">✨ All picks reset. Start fresh.</div>`;
        }
    }

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // INIT
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    loadPicks();
    renderMatches();

    document.getElementById("generateBtn").addEventListener("click", generateRoad);
    document.getElementById("resetBtn").addEventListener("click", resetAll);
    document.getElementById("shareBtn").addEventListener("click", shareBracket);
</script>

</body>
</html>
